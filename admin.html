<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل مدیریت | Dr Borodat</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f4f7fa;
color:#102238
}

button,input,textarea,select{
font-family:inherit
}

.header{
background:#071b31;
color:#fff;
padding:18px 5%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10
}

.logo{
font-family:Arial,sans-serif;
font-size:20px;
font-weight:800;
direction:ltr
}

.logo span{color:#6cccf3}

.status{
font-size:11px;
color:#bcd0df
}

.container{
width:92%;
max-width:1300px;
margin:30px auto
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px
}

.stat-card{
background:#fff;
border:1px solid #e1e7ec;
border-radius:12px;
padding:20px
}

.stat-card small{
display:block;
color:#718192;
font-size:10px;
margin-bottom:10px
}

.stat-card strong{
font-family:Arial;
font-size:28px;
color:#0879bd
}

.panel{
background:#fff;
border:1px solid #e1e7ec;
border-radius:12px;
padding:22px;
margin-bottom:20px
}

.panel-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px
}

.panel-title h2{
font-size:16px;
margin:0
}

.refresh{
border:0;
background:#0879bd;
color:#fff;
border-radius:7px;
padding:9px 15px;
font-size:10px;
cursor:pointer
}

table{
width:100%;
border-collapse:collapse;
font-size:10px
}

th{
background:#f1f5f8;
color:#40576b;
font-weight:bold
}

th,td{
padding:12px 8px;
border-bottom:1px solid #e7edf1;
text-align:right;
vertical-align:top
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#eaf5fb;
color:#0879bd;
font-size:9px
}

.actions{
display:flex;
gap:5px;
flex-wrap:wrap
}

.actions button{
border:1px solid #dce5eb;
background:#fff;
border-radius:6px;
padding:6px 9px;
font-size:9px;
cursor:pointer
}

.actions button:hover{
background:#071b31;
color:#fff
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.form-grid input,
.form-grid textarea,
.form-grid select{
width:100%;
padding:11px;
border:1px solid #dce5eb;
border-radius:7px;
outline:none;
font-size:10px
}

.form-grid textarea{
min-height:80px;
resize:vertical
}

.form-full{
grid-column:1/-1
}

.add-btn{
border:0;
background:#0879bd;
color:#fff;
padding:11px 18px;
border-radius:7px;
font-size:10px;
cursor:pointer
}

.message{
display:none;
padding:10px;
border-radius:7px;
font-size:10px;
margin-top:12px
}

.message.success{
display:block;
background:#e9f8ef;
color:#176b3b
}

.message.error{
display:block;
background:#fff0f0;
color:#a22626
}

.empty{
text-align:center;
padding:30px;
color:#8a99a7;
font-size:11px
}

/* CHAT */

.chat-list{
display:grid;
grid-template-columns:300px minmax(0,1fr);
gap:15px;
height:520px
}

.chat-users{
border:1px solid #e1e7ec;
border-radius:9px;
overflow-y:auto;
height:100%;
background:#fff
}

.chat-user{
padding:14px;
border-bottom:1px solid #edf1f4;
cursor:pointer;
transition:.15s
}

.chat-user:hover,
.chat-user.active{
background:#edf7fb
}

.chat-user strong{
display:block;
font-size:11px;
margin-bottom:6px
}

.chat-user small{
color:#81909d;
font-size:9px
}

.chat-box{
border:1px solid #e1e7ec;
border-radius:9px;
display:flex;
flex-direction:column;
min-width:0;
height:100%;
overflow:hidden
}

.chat-header{
padding:13px 15px;
background:#071b31;
color:#fff;
font-size:11px;
flex-shrink:0
}

.chat-header strong{
display:block;
margin-bottom:5px
}

.chat-header small{
opacity:.75
}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
background:#f8fafc;
display:flex;
flex-direction:column
}

.msg{
max-width:75%;
padding:10px 12px;
border-radius:12px;
margin-bottom:10px;
font-size:10px;
line-height:1.9;
word-break:break-word
}

.msg.customer{
background:#fff;
border:1px solid #e1e7ec;
margin-left:auto;
border-radius:12px 12px 3px 12px
}

.msg.admin{
background:#0879bd;
color:#fff;
margin-right:auto;
border-radius:12px 12px 12px 3px
}

.msg-time{
display:block;
font-size:7px;
opacity:.65;
margin-top:4px
}

.reply{
display:flex;
gap:7px;
padding:10px;
border-top:1px solid #e1e7ec;
background:#fff;
flex-shrink:0
}

.reply input{
flex:1;
min-width:0;
border:1px solid #dce5eb;
border-radius:8px;
padding:11px;
font-size:10px;
outline:none
}

.reply input:focus{
border-color:#0879bd
}

.reply button{
border:0;
background:#071b31;
color:#fff;
border-radius:8px;
padding:0 20px;
cursor:pointer;
font-size:10px;
white-space:nowrap
}

.reply button:disabled{
opacity:.5;
cursor:not-allowed
}

.chat-error{
padding:10px;
margin:10px;
background:#fff0f0;
color:#a22626;
border-radius:7px;
font-size:9px;
display:none
}

@media(max-width:800px){

.cards{
grid-template-columns:1fr 1fr
}

.form-grid{
grid-template-columns:1fr
}

.form-full{
grid-column:auto
}

.chat-list{
grid-template-columns:1fr;
height:auto
}

.chat-users{
height:220px
}

.chat-box{
height:500px
}

table{
display:block;
overflow-x:auto;
white-space:nowrap
}

}

@media(max-width:500px){

.cards{
grid-template-columns:1fr 1fr
}

.container{
width:94%
}

.header{
padding:15px 3%
}

.panel{
padding:15px
}

.chat-list{
gap:10px
}

}
</style>
</head>

<body>

<header class="header">

<div class="logo">
Dr <span>Borodat</span>
</div>

<div class="status" id="status">
در حال اتصال...
</div>

</header>


<main class="container">


<!-- STATS -->

<div class="cards">

<div class="stat-card">
<small>درخواست‌های خدمات</small>
<strong id="requestCount">0</strong>
</div>

<div class="stat-card">
<small>گفتگوها</small>
<strong id="chatCount">0</strong>
</div>

<div class="stat-card">
<small>محصولات</small>
<strong id="productCount">0</strong>
</div>

<div class="stat-card">
<small>سفارش‌ها</small>
<strong id="orderCount">0</strong>
</div>

</div>


<!-- REQUESTS -->

<section class="panel">

<div class="panel-title">

<h2>📥 درخواست‌های خدمات</h2>

<button class="refresh" onclick="loadDashboard()">
↻ بروزرسانی
</button>

</div>

<div id="requests"></div>

</section>


<!-- PRODUCTS -->

<section class="panel">

<div class="panel-title">
<h2>🛒 مدیریت محصولات</h2>
</div>

<form id="productForm">

<div class="form-grid">

<input
id="productName"
placeholder="نام محصول"
required
>

<input
id="productPrice"
placeholder="قیمت"
required
>

<input
id="productStock"
placeholder="موجودی"
value="0"
>

<input
id="productCategory"
placeholder="دسته‌بندی"
required
>

<input
class="form-full"
id="productImage"
placeholder="آدرس تصویر محصول"
>

<textarea
class="form-full"
id="productDescription"
placeholder="توضیحات محصول"
></textarea>

<div class="form-full">

<button
class="add-btn"
type="submit"
>
➕ افزودن محصول
</button>

</div>

</div>

</form>

<div id="productMessage" class="message"></div>

</section>


<!-- PRODUCTS LIST -->

<section class="panel">

<div class="panel-title">
<h2>📦 محصولات</h2>
</div>

<div id="products"></div>

</section>


<!-- ORDERS -->

<section class="panel">

<div class="panel-title">
<h2>🛍️ سفارش‌ها</h2>
</div>

<div id="orders"></div>

</section>


<!-- SUPPORT -->

<section class="panel">

<div class="panel-title">

<h2>💬 پشتیبانی آنلاین</h2>

<button
class="refresh"
onclick="loadDashboard(true)"
>
↻ بروزرسانی گفتگوها
</button>

</div>


<div class="chat-list">


<div
class="chat-users"
id="chatUsers"
>

<div class="empty">
هنوز گفتگویی ثبت نشده است.
</div>

</div>


<div class="chat-box">


<div
class="chat-header"
id="chatHeader"
>
یک گفتگو را انتخاب کنید
</div>


<div
class="messages"
id="messages"
>

<div class="empty">
از سمت راست یک گفتگو را انتخاب کنید.
</div>

</div>


<div
id="chatError"
class="chat-error"
></div>


<div class="reply">

<input
id="replyInput"
placeholder="پاسخ خود را بنویسید..."
autocomplete="off"
>

<button
id="replyButton"
onclick="sendReply()"
>
ارسال
</button>

</div>


</div>

</div>

</section>

</main>


<script>

const API_BASE = "";

let dashboardData = {
requests:[],
chats:[],
products:[],
orders:[]
};

let selectedChat = null;


/* =====================================================
API
===================================================== */

function api(path){
return API_BASE + path;
}


async function readResponse(response){

const text = await response.text();

if(!text){

throw new Error(
"سرور پاسخ خالی فرستاد."
);

}

try{

return JSON.parse(text);

}catch(e){

console.error(
"NON JSON RESPONSE:",
text
);

throw new Error(
"سرور به‌جای JSON پاسخ دیگری فرستاد. وضعیت: " +
response.status
);

}

}


/* =====================================================
LOAD DASHBOARD
===================================================== */

async function loadDashboard(keepChat=false){

const status =
document.getElementById("status");

const oldChat =
selectedChat;

status.textContent =
"در حال دریافت اطلاعات...";

try{

const response =
await fetch(
api("/api/admin/dashboard"),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

const data =
await readResponse(response);

if(!response.ok){

throw new Error(
data.message ||
"خطای سرور: " + response.status
);

}

if(data.success !== true){

throw new Error(
data.message ||
"پاسخ سرور معتبر نیست."
);

}

dashboardData = {

requests:
Array.isArray(data.requests)
? data.requests
:[],

chats:
Array.isArray(data.chats)
? data.chats
:[],

products:
Array.isArray(data.products)
? data.products
:[],

orders:
Array.isArray(data.orders)
? data.orders
:[]

};


renderAll();


if(
keepChat &&
oldChat &&
dashboardData.chats.some(
chat=>chat.id===oldChat
)
){

selectChat(oldChat);

}


status.textContent =
"● آنلاین";

status.style.color =
"#78e08f";

}catch(error){

console.error(
"ADMIN ERROR:",
error
);

status.textContent =
"● خطا";

status.style.color =
"#ff8b8b";

alert(error.message);

}

}


/* =====================================================
RENDER ALL
===================================================== */

function renderAll(){

document.getElementById(
"requestCount"
).textContent =
dashboardData.requests.length;

document.getElementById(
"chatCount"
).textContent =
dashboardData.chats.length;

document.getElementById(
"productCount"
).textContent =
dashboardData.products.length;

document.getElementById(
"orderCount"
).textContent =
dashboardData.orders.length;

renderRequests();
renderProducts();
renderOrders();
renderChats();

}


/* =====================================================
REQUESTS
===================================================== */

function renderRequests(){

const box =
document.getElementById("requests");

if(!dashboardData.requests.length){

box.innerHTML =
'<div class="empty">درخواستی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>
<th>نام</th>
<th>شماره</th>
<th>خدمت</th>
<th>توضیحات</th>
<th>زمان</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>

</thead>

<tbody>

${dashboardData.requests.map(item=>`

<tr>

<td>
${escapeHtml(item.name)}
</td>

<td dir="ltr">
${escapeHtml(item.phone)}
</td>

<td>
${escapeHtml(item.service)}
</td>

<td>
${escapeHtml(item.description || "-")}
</td>

<td dir="ltr">
${escapeHtml(item.created_at)}
</td>

<td>
<span class="badge">
${escapeHtml(item.status || "new")}
</span>
</td>

<td>

<div class="actions">

<button
onclick="updateRequest('${item.id}','processing')"
>
در حال انجام
</button>

<button
onclick="updateRequest('${item.id}','done')"
>
انجام شد
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
PRODUCTS
===================================================== */

function renderProducts(){

const box =
document.getElementById("products");

if(!dashboardData.products.length){

box.innerHTML =
'<div class="empty">محصولی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>
<th>نام</th>
<th>دسته‌بندی</th>
<th>قیمت</th>
<th>موجودی</th>
<th>عملیات</th>
</tr>

</thead>

<tbody>

${dashboardData.products.map(product=>`

<tr>

<td>
${escapeHtml(product.name)}
</td>

<td>
${escapeHtml(product.category)}
</td>

<td>
${escapeHtml(product.price)}
</td>

<td>
${escapeHtml(product.stock)}
</td>

<td>

<div class="actions">

<button
onclick="editProduct('${product.id}')"
>
ویرایش
</button>

<button
onclick="deleteProduct('${product.id}')"
>
حذف
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
ORDERS
===================================================== */

function renderOrders(){

const box =
document.getElementById("orders");

if(!dashboardData.orders.length){

box.innerHTML =
'<div class="empty">سفارشی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>
<th>نام</th>
<th>شماره</th>
<th>محصول</th>
<th>تعداد</th>
<th>زمان</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>

</thead>

<tbody>

${dashboardData.orders.map(order=>`

<tr>

<td>
${escapeHtml(order.name)}
</td>

<td dir="ltr">
${escapeHtml(order.phone)}
</td>

<td>
${escapeHtml(order.product_name)}
</td>

<td>
${escapeHtml(order.quantity)}
</td>

<td dir="ltr">
${escapeHtml(order.created_at)}
</td>

<td>

<span class="badge">
${escapeHtml(order.status || "new")}
</span>

</td>

<td>

<div class="actions">

<button
onclick="updateOrder('${order.id}','processing')"
>
در حال انجام
</button>

<button
onclick="updateOrder('${order.id}','done')"
>
تکمیل شد
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
CHATS LIST
===================================================== */

function renderChats(){

const box =
document.getElementById("chatUsers");

if(!dashboardData.chats.length){

box.innerHTML =
'<div class="empty">هنوز گفتگویی ثبت نشده است.</div>';

return;

}

const sortedChats =
[...dashboardData.chats].sort(
(a,b)=>
new Date(b.updated_at || b.created_at) -
new Date(a.updated_at || a.created_at)
);

box.innerHTML =
sortedChats.map(chat=>`

<div
class="chat-user ${
selectedChat===chat.id ? "active" : ""
}"
onclick="selectChat('${chat.id}')"
>

<strong>
${escapeHtml(chat.name)}
</strong>

<small dir="ltr">
${escapeHtml(chat.phone)}
</small>

</div>

`).join("");

}


/* =====================================================
SELECT CHAT
===================================================== */

function selectChat(id){

selectedChat = id;

renderChats();

const chat =
dashboardData.chats.find(
item=>item.id===id
);

const messages =
document.getElementById("messages");

const header =
document.getElementById("chatHeader");

if(!chat){

header.textContent =
"گفتگو پیدا نشد";

messages.innerHTML =
'<div class="empty">گفتگو پیدا نشد.</div>';

return;

}

header.innerHTML = `
<strong>${escapeHtml(chat.name)}</strong>
<small dir="ltr">${escapeHtml(chat.phone)}</small>
`;

const chatMessages =
Array.isArray(chat.messages)
? chat.messages
:[];

if(!chatMessages.length){

messages.innerHTML =
'<div class="empty">پیامی ثبت نشده است.</div>';

return;

}

messages.innerHTML =
chatMessages.map(message=>`

<div class="msg ${
message.sender==="admin"
? "admin"
: "customer"
}">

${escapeHtml(message.message)}

<span class="msg-time">
${escapeHtml(message.created_at || "")}
</span>

</div>

`).join("");

setTimeout(()=>{
messages.scrollTop =
messages.scrollHeight;
},50);

}


/* =====================================================
SEND REPLY
===================================================== */

async function sendReply(){

if(!selectedChat){

alert(
"ابتدا یک گفتگو را انتخاب کنید."
);

return;

}

const input =
document.getElementById("replyInput");

const button =
document.getElementById("replyButton");

const message =
input.value.trim();

if(!message){

return;

}

button.disabled = true;
button.textContent = "در حال ارسال...";

try{

const response =
await fetch(
api("/api/admin/chat/reply"),
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
chat_id:selectedChat,
message:message
})
}
);

const data =
await readResponse(response);

if(!response.ok){

throw new Error(
data.message ||
"خطای سرور هنگام ارسال پاسخ."
);

}

if(data.success !== true){

throw new Error(
data.message ||
"ارسال پاسخ ناموفق بود."
);

}

input.value = "";

await loadDashboard(true);

selectChat(selectedChat);

}catch(error){

console.error(
"REPLY ERROR:",
error
);

alert(
error.message
);

}finally{

button.disabled = false;
button.textContent = "ارسال";

}

}


/* =====================================================
ENTER TO SEND
===================================================== */

document
.getElementById("replyInput")
.addEventListener(
"keydown",
function(e){

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();

sendReply();

}

}
);


/* =====================================================
ADD PRODUCT
===================================================== */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const message =
document.getElementById(
"productMessage"
);

const payload = {

name:
document.getElementById(
"productName"
).value.trim(),

price:
document.getElementById(
"productPrice"
).value.trim(),

stock:
document.getElementById(
"productStock"
).value.trim(),

category:
document.getElementById(
"productCategory"
).value.trim(),

image:
document.getElementById(
"productImage"
).value.trim(),

description:
document.getElementById(
"productDescription"
).value.trim()

};

try{

const response =
await fetch(
api("/api/admin/products"),
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify(payload)
}
);

const data =
await readResponse(response);

if(!response.ok){

throw new Error(
data.message ||
"ثبت محصول ناموفق بود."
);

}

if(data.success !== true){

throw new Error(
data.message ||
"ثبت محصول ناموفق بود."
);

}

message.className =
"message success";

message.textContent =
"محصول با موفقیت اضافه شد.";

this.reset();

await loadDashboard();

}catch(error){

message.className =
"message error";

message.textContent =
error.message;

}

}
);


/* =====================================================
DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

if(!confirm(
"این محصول حذف شود؟"
))return;

try{

const response =
await fetch(
api("/api/admin/products/"+id),
{
method:"DELETE",
headers:{
"Accept":"application/json"
}
}
);

const data =
await readResponse(response);

if(!response.ok || data.success !== true){

throw new Error(
data.message ||
"حذف محصول ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(error.message);

}

}


/* =====================================================
EDIT PRODUCT
===================================================== */

async function editProduct(id){

const product =
dashboardData.products.find(
item=>item.id===id
);

if(!product)return;

const name =
prompt(
"نام محصول:",
product.name
);

if(name===null)return;

const price =
prompt(
"قیمت:",
product.price
);

if(price===null)return;

const stock =
prompt(
"موجودی:",
product.stock
);

if(stock===null)return;

const category =
prompt(
"دسته‌بندی:",
product.category
);

if(category===null)return;

try{

const response =
await fetch(
api("/api/admin/products/"+id),
{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
name:name,
price:price,
stock:stock,
category:category
})
}
);

const data =
await readResponse(response);

if(!response.ok || data.success !== true){

throw new Error(
data.message ||
"ویرایش ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(error.message);

}

}

/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
