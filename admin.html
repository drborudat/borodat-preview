<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>پنل مدیریت | Dr Borodat</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f4f7fa;
color:#102238
}

button,input,textarea,select{
font-family:inherit
}

.header{
background:#071b31;
color:#fff;
padding:18px 5%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10
}

.logo{
font-family:Arial,sans-serif;
font-size:20px;
font-weight:800;
direction:ltr
}

.logo span{
color:#6cccf3
}

.status{
font-size:11px;
color:#bcd0df
}

.container{
width:92%;
max-width:1300px;
margin:30px auto
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px
}

.stat-card{
background:#fff;
border:1px solid #e1e7ec;
border-radius:12px;
padding:20px
}

.stat-card small{
display:block;
color:#718192;
font-size:10px;
margin-bottom:10px
}

.stat-card strong{
font-family:Arial;
font-size:28px;
color:#0879bd
}

.panel{
background:#fff;
border:1px solid #e1e7ec;
border-radius:12px;
padding:22px;
margin-bottom:20px
}

.panel-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px
}

.panel-title h2{
font-size:16px;
margin:0
}

.refresh{
border:0;
background:#0879bd;
color:#fff;
border-radius:7px;
padding:9px 15px;
font-size:10px;
cursor:pointer
}

table{
width:100%;
border-collapse:collapse;
font-size:10px
}

th{
background:#f1f5f8;
color:#40576b;
font-weight:bold
}

th,td{
padding:12px 8px;
border-bottom:1px solid #e7edf1;
text-align:right;
vertical-align:top
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#eaf5fb;
color:#0879bd;
font-size:9px
}

.actions{
display:flex;
gap:5px;
flex-wrap:wrap
}

.actions button{
border:1px solid #dce5eb;
background:#fff;
border-radius:6px;
padding:6px 9px;
font-size:9px;
cursor:pointer
}

.actions button:hover{
background:#071b31;
color:#fff
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.form-grid input,
.form-grid textarea,
.form-grid select{
width:100%;
padding:11px;
border:1px solid #dce5eb;
border-radius:7px;
outline:none;
font-size:10px
}

.form-grid textarea{
min-height:80px;
resize:vertical
}

.form-full{
grid-column:1/-1
}

.add-btn{
border:0;
background:#0879bd;
color:#fff;
padding:11px 18px;
border-radius:7px;
font-size:10px;
cursor:pointer
}

.message{
display:none;
padding:10px;
border-radius:7px;
font-size:10px;
margin-top:12px
}

.message.success{
display:block;
background:#e9f8ef;
color:#176b3b
}

.message.error{
display:block;
background:#fff0f0;
color:#a22626
}

.empty{
text-align:center;
padding:30px;
color:#8a99a7;
font-size:11px
}

.chat-list{
display:grid;
grid-template-columns:300px 1fr;
gap:15px;
min-height:300px
}

.chat-users{
border:1px solid #e1e7ec;
border-radius:9px;
overflow:auto;
max-height:400px
}

.chat-user{
padding:13px;
border-bottom:1px solid #edf1f4;
cursor:pointer
}

.chat-user:hover,
.chat-user.active{
background:#edf7fb
}

.chat-user strong{
display:block;
font-size:10px
}

.chat-user small{
color:#81909d;
font-size:8px
}

.chat-box{
border:1px solid #e1e7ec;
border-radius:9px;
padding:15px;
display:flex;
flex-direction:column
}

.messages{
flex:1;
max-height:300px;
overflow:auto;
padding:5px
}

.msg{
max-width:75%;
padding:9px 11px;
border-radius:10px;
margin-bottom:8px;
font-size:9px;
line-height:1.8
}

.msg.customer{
background:#edf3f7;
margin-left:auto;
border-radius:10px 10px 3px 10px
}

.msg.admin{
background:#0879bd;
color:#fff;
margin-right:auto;
border-radius:10px 10px 10px 3px
}

.reply{
display:flex;
gap:7px;
margin-top:10px
}

.reply input{
flex:1;
border:1px solid #dce5eb;
border-radius:7px;
padding:10px;
font-size:9px;
outline:none
}

.reply button{
border:0;
background:#071b31;
color:#fff;
border-radius:7px;
padding:0 16px;
cursor:pointer;
font-size:9px
}

@media(max-width:800px){

.cards{
grid-template-columns:1fr 1fr
}

.form-grid{
grid-template-columns:1fr
}

.form-full{
grid-column:auto
}

.chat-list{
grid-template-columns:1fr
}

table{
display:block;
overflow-x:auto;
white-space:nowrap
}

}

@media(max-width:500px){

.cards{
grid-template-columns:1fr 1fr
}

.container{
width:94%
}

.header{
padding:15px 3%
}

}
</style>
</head>

<body>

<header class="header">

<div class="logo">
Dr <span>Borodat</span>
</div>

<div class="status" id="status">
در حال اتصال...
</div>

</header>

<main class="container">

<div class="cards">

<div class="stat-card">
<small>درخواست‌های خدمات</small>
<strong id="requestCount">0</strong>
</div>

<div class="stat-card">
<small>گفتگوها</small>
<strong id="chatCount">0</strong>
</div>

<div class="stat-card">
<small>محصولات</small>
<strong id="productCount">0</strong>
</div>

<div class="stat-card">
<small>سفارش‌ها</small>
<strong id="orderCount">0</strong>
</div>

</div>

<section class="panel">

<div class="panel-title">

<h2>📥 درخواست‌های خدمات</h2>

<button class="refresh" onclick="loadDashboard()">
↻ بروزرسانی
</button>

</div>

<div id="requests"></div>

</section>

<section class="panel">

<div class="panel-title">

<h2>🛒 مدیریت محصولات</h2>

</div>

<form id="productForm">

<div class="form-grid">

<input id="productName" placeholder="نام محصول" required>

<input id="productPrice" placeholder="قیمت" required>

<input id="productStock" placeholder="موجودی" value="0">

<input id="productCategory" placeholder="دسته‌بندی" required>

<input class="form-full" id="productImage" placeholder="آدرس تصویر محصول">

<textarea
class="form-full"
id="productDescription"
placeholder="توضیحات محصول"
></textarea>

<div class="form-full">

<button class="add-btn" type="submit">
➕ افزودن محصول
</button>

</div>

</div>

</form>

<div id="productMessage" class="message"></div>

</section>

<section class="panel">

<div class="panel-title">

<h2>📦 محصولات</h2>

</div>

<div id="products"></div>

</section>

<section class="panel">

<div class="panel-title">

<h2>🛍️ سفارش‌ها</h2>

</div>

<div id="orders"></div>

</section>

<section class="panel">

<div class="panel-title">

<h2>💬 پشتیبانی آنلاین</h2>

</div>

<div class="chat-list">

<div class="chat-users" id="chatUsers">

<div class="empty">
هنوز گفتگویی ثبت نشده است.
</div>

</div>

<div class="chat-box">

<div class="messages" id="messages">

<div class="empty">
یک گفتگو را انتخاب کنید.
</div>

</div>

<div class="reply">

<input
id="replyInput"
placeholder="پاسخ خود را بنویسید..."
>

<button onclick="sendReply()">
ارسال
</button>

</div>

</div>

</div>

</section>

</main>

<script>

/* =====================================================
API
===================================================== */

/*
اگر Admin و Server روی یک Render Service هستند،
همین مقدار خالی درست است.

اگر Admin را روی سرویس جدا گذاشته‌ای،
فقط مقدار زیر را با آدرس Render مربوط به Server عوض می‌کنیم.
*/
const API_BASE = "";


/* =====================================================
DATA
===================================================== */

let dashboardData = {
requests: [],
chats: [],
products: [],
orders: []
};

let selectedChat = null;


/* =====================================================
API URL
===================================================== */

function api(path){

return API_BASE + path;

}


/* =====================================================
LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

const status = document.getElementById("status");

status.textContent = "در حال دریافت اطلاعات...";

try{

const response = await fetch(
api("/api/admin/dashboard"),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!response.ok){

throw new Error(
"سرور پاسخ صحیح نداد (" +
response.status +
")"
);

}

const data = await response.json();

if(!data.success){

throw new Error(
"دریافت اطلاعات ناموفق بود."
);

}

dashboardData = {

requests:Array.isArray(data.requests)
? data.requests
: [],

chats:Array.isArray(data.chats)
? data.chats
: [],

products:Array.isArray(data.products)
? data.products
: [],

orders:Array.isArray(data.orders)
? data.orders
: []

};

renderAll();

status.textContent = "● آنلاین";

status.style.color = "#78e08f";

}catch(error){

console.error(
"Dashboard connection error:",
error
);

status.textContent =
"● خطا در اتصال";

status.style.color = "#ff8b8b";

}

}


/* =====================================================
RENDER ALL
===================================================== */

function renderAll(){

document.getElementById(
"requestCount"
).textContent =
dashboardData.requests.length;

document.getElementById(
"chatCount"
).textContent =
dashboardData.chats.length;

document.getElementById(
"productCount"
).textContent =
dashboardData.products.length;

document.getElementById(
"orderCount"
).textContent =
dashboardData.orders.length;

renderRequests();
renderProducts();
renderOrders();
renderChats();

}


/* =====================================================
REQUESTS
===================================================== */

function renderRequests(){

const box =
document.getElementById("requests");

if(!dashboardData.requests.length){

box.innerHTML =
'<div class="empty">درخواستی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>

<th>نام</th>
<th>شماره</th>
<th>خدمت</th>
<th>توضیحات</th>
<th>زمان</th>
<th>وضعیت</th>
<th>عملیات</th>

</tr>

</thead>

<tbody>

${dashboardData.requests.map(item => `

<tr>

<td>
${escapeHtml(item.name)}
</td>

<td dir="ltr">
${escapeHtml(item.phone)}
</td>

<td>
${escapeHtml(item.service)}
</td>

<td>
${escapeHtml(item.description || "-")}
</td>

<td dir="ltr">
${escapeHtml(item.created_at)}
</td>

<td>

<span class="badge">
${escapeHtml(item.status || "new")}
</span>

</td>

<td>

<div class="actions">

<button onclick="updateRequest('${item.id}','done')">
انجام شد
</button>

<button onclick="updateRequest('${item.id}','processing')">
در حال انجام
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
PRODUCTS
===================================================== */

function renderProducts(){

const box =
document.getElementById("products");

if(!dashboardData.products.length){

box.innerHTML =
'<div class="empty">محصولی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>

<th>نام</th>
<th>دسته‌بندی</th>
<th>قیمت</th>
<th>موجودی</th>
<th>عملیات</th>

</tr>

</thead>

<tbody>

${dashboardData.products.map(product => `

<tr>

<td>
${escapeHtml(product.name)}
</td>

<td>
${escapeHtml(product.category)}
</td>

<td>
${escapeHtml(product.price)}
</td>

<td>
${escapeHtml(product.stock)}
</td>

<td>

<div class="actions">

<button onclick="editProduct('${product.id}')">
ویرایش
</button>

<button onclick="deleteProduct('${product.id}')">
حذف
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
ORDERS
===================================================== */

function renderOrders(){

const box =
document.getElementById("orders");

if(!dashboardData.orders.length){

box.innerHTML =
'<div class="empty">سفارشی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>

<th>نام</th>
<th>شماره</th>
<th>محصول</th>
<th>تعداد</th>
<th>زمان</th>
<th>وضعیت</th>
<th>عملیات</th>

</tr>

</thead>

<tbody>

${dashboardData.orders.map(order => `

<tr>

<td>
${escapeHtml(order.name)}
</td>

<td dir="ltr">
${escapeHtml(order.phone)}
</td>

<td>
${escapeHtml(order.product_name)}
</td>

<td>
${escapeHtml(order.quantity)}
</td>

<td dir="ltr">
${escapeHtml(order.created_at)}
</td>

<td>

<span class="badge">
${escapeHtml(order.status || "new")}
</span>

</td>

<td>

<div class="actions">

<button onclick="updateOrder('${order.id}','processing')">
در حال انجام
</button>

<button onclick="updateOrder('${order.id}','done')">
تکمیل شد
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
CHATS
===================================================== */

function renderChats(){

const box =
document.getElementById("chatUsers");

if(!dashboardData.chats.length){

box.innerHTML =
'<div class="empty">هنوز گفتگویی ثبت نشده است.</div>';

return;

}

box.innerHTML =
dashboardData.chats.map(chat => `

<div
class="chat-user ${selectedChat === chat.id ? "active" : ""}"
onclick="selectChat('${chat.id}')"
>

<strong>
${escapeHtml(chat.name)}
</strong>

<small dir="ltr">
${escapeHtml(chat.phone)}
</small>

</div>

`).join("");

}


/* =====================================================
SELECT CHAT
===================================================== */

function selectChat(id){

selectedChat = id;

renderChats();

const chat =
dashboardData.chats.find(
item => item.id === id
);

const box =
document.getElementById("messages");

if(!chat){

box.innerHTML =
'<div class="empty">گفتگو پیدا نشد.</div>';

return;

}

const messages =
Array.isArray(chat.messages)
? chat.messages
: [];

if(!messages.length){

box.innerHTML =
'<div class="empty">پیامی ثبت نشده است.</div>';

return;

}

box.innerHTML =
messages.map(message => `

<div class="msg ${message.sender === "admin" ? "admin" : "customer"}">

${escapeHtml(message.message)}

<br>

<small>
${escapeHtml(message.created_at)}
</small>

</div>

`).join("");

}


/* =====================================================
SEND REPLY
===================================================== */

async function sendReply(){

if(!selectedChat){

alert("ابتدا یک گفتگو را انتخاب کنید.");

return;

}

const input =
document.getElementById("replyInput");

const message =
input.value.trim();

if(!message){

return;

}

try{

const response =
await fetch(
api("/api/admin/chat/reply"),
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
chat_id:selectedChat,
message:message
})
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message ||
"ارسال پاسخ ناموفق بود."
);

}

input.value = "";

await loadDashboard();

selectChat(selectedChat);

}catch(error){

alert(error.message);

}

}


/* =====================================================
ADD PRODUCT
===================================================== */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const message =
document.getElementById(
"productMessage"
);

const payload = {

name:
document.getElementById(
"productName"
).value.trim(),

price:
document.getElementById(
"productPrice"
).value.trim(),

stock:
document.getElementById(
"productStock"
).value.trim(),

category:
document.getElementById(
"productCategory"
).value.trim(),

image:
document.getElementById(
"productImage"
).value.trim(),

description:
document.getElementById(
"productDescription"
).value.trim()

};

try{

const response =
await fetch(
api("/api/admin/products"),
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify(payload)
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message ||
"ثبت محصول ناموفق بود."
);

}

message.className =
"message success";

message.textContent =
"محصول با موفقیت اضافه شد.";

this.reset();

await loadDashboard();

}catch(error){

message.className =
"message error";

message.textContent =
error.message;

}

});


/* =====================================================
DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

if(!confirm(
"این محصول حذف شود؟"
)){

return;

}

try{

const response =
await fetch(
api("/api/admin/products/" + id),
{
method:"DELETE",
headers:{
"Accept":"application/json"
}
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message ||
"حذف محصول ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(error.message);

}

}


/* =====================================================
EDIT PRODUCT
===================================================== */

async function editProduct(id){

const product =
dashboardData.products.find(
item => item.id === id
);

if(!product){

return;

}

const name =
prompt(
"نام محصول:",
product.name
);

if(name === null){

return;

}

const price =
prompt(
"قیمت:",
product.price
);

if(price === null){

return;

}

const stock =
prompt(
"موجودی:",
product.stock
);

if(stock === null){

return;

}

const category =
prompt(
"دسته‌بندی:",
product.category
);

if(category === null){

return;

}

try{

const response =
await fetch(
api("/api/admin/products/" + id),
{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
name:name,
price:price,
stock:stock,
category:category
})
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message ||
"ویرایش ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(error.message);

}

}


/* =====================================================
UPDATE ORDER
===================================================== */

async function updateOrder(id,status){

try{

const response =
await fetch(
api("/api/admin/orders/" + id),
{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
status:status
})
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message ||
"تغییر وضعیت ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(error.message);

}

}


/* =====================================================
UPDATE REQUEST
===================================================== */

async function updateRequest(id,status){

try{

const response =
await fetch(
api("/api/admin/requests/" + id),
{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
status:status
})
}
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message ||
"تغییر وضعیت ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(error.message);

}

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
START
===================================================== */

loadDashboard();

</script>

</body>
</html>
