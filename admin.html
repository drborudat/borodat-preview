<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل مدیریت | Dr Borodat</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f4f7fa;
color:#102238
}

button,input,textarea,select{font-family:inherit}

.header{
background:#071b31;
color:#fff;
padding:18px 5%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10
}

.logo{
font-family:Arial,sans-serif;
font-size:20px;
font-weight:800;
direction:ltr
}

.logo span{color:#6cccf3}

.status{
font-size:11px;
color:#bcd0df
}

.container{
width:92%;
max-width:1300px;
margin:30px auto
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px
}

.stat-card{
background:#fff;
border:1px solid #e1e7ec;
border-radius:12px;
padding:20px
}

.stat-card small{
display:block;
color:#718192;
font-size:10px;
margin-bottom:10px
}

.stat-card strong{
font-family:Arial;
font-size:28px;
color:#0879bd
}

.panel{
background:#fff;
border:1px solid #e1e7ec;
border-radius:12px;
padding:22px;
margin-bottom:20px
}

.panel-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px
}

.panel-title h2{
font-size:16px;
margin:0
}

.refresh{
border:0;
background:#0879bd;
color:#fff;
border-radius:7px;
padding:9px 15px;
font-size:10px;
cursor:pointer
}

table{
width:100%;
border-collapse:collapse;
font-size:10px
}

th{
background:#f1f5f8;
color:#40576b;
font-weight:bold
}

th,td{
padding:12px 8px;
border-bottom:1px solid #e7edf1;
text-align:right;
vertical-align:top
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#eaf5fb;
color:#0879bd;
font-size:9px
}

.actions{
display:flex;
gap:5px;
flex-wrap:wrap
}

.actions button{
border:1px solid #dce5eb;
background:#fff;
border-radius:6px;
padding:6px 9px;
font-size:9px;
cursor:pointer
}

.actions button:hover{
background:#071b31;
color:#fff
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.form-grid input,
.form-grid textarea,
.form-grid select{
width:100%;
padding:11px;
border:1px solid #dce5eb;
border-radius:7px;
outline:none;
font-size:10px
}

.form-grid textarea{
min-height:80px;
resize:vertical
}

.form-full{
grid-column:1/-1
}

.add-btn{
border:0;
background:#0879bd;
color:#fff;
padding:11px 18px;
border-radius:7px;
font-size:10px;
cursor:pointer
}

.message{
display:none;
padding:10px;
border-radius:7px;
font-size:10px;
margin-top:12px
}

.message.success{
display:block;
background:#e9f8ef;
color:#176b3b
}

.message.error{
display:block;
background:#fff0f0;
color:#a22626
}

.empty{
text-align:center;
padding:30px;
color:#8a99a7;
font-size:11px
}

/* ================= CHAT ================= */

.chat-list{
display:grid;
grid-template-columns:320px minmax(0,1fr);
gap:15px;
height:600px
}

.chat-users{
border:1px solid #e1e7ec;
border-radius:10px;
overflow-y:auto;
background:#fafcfd
}

.chat-user{
padding:15px;
border-bottom:1px solid #edf1f4;
cursor:pointer;
transition:.2s
}

.chat-user:hover,
.chat-user.active{
background:#e8f5fb
}

.chat-user strong{
display:block;
font-size:11px;
margin-bottom:6px
}

.chat-user small{
color:#81909d;
font-size:9px
}

.chat-user .last-message{
margin-top:7px;
font-size:9px;
color:#687987;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.chat-user .chat-time{
margin-top:5px;
font-size:8px;
color:#9aa7b2
}

.chat-box{
border:1px solid #e1e7ec;
border-radius:10px;
display:flex;
flex-direction:column;
min-width:0;
overflow:hidden;
background:#fff
}

.chat-header{
background:#071b31;
color:#fff;
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
min-height:58px
}

.chat-header strong{
font-size:11px
}

.chat-header small{
font-size:8px;
color:#bcd0df;
display:block;
margin-top:4px
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
background:#f7fafc;
display:flex;
flex-direction:column
}

.msg{
max-width:72%;
padding:11px 13px;
border-radius:12px;
margin-bottom:10px;
font-size:10px;
line-height:1.9;
word-break:break-word;
box-shadow:0 1px 2px rgba(0,0,0,.04)
}

.msg.customer{
background:#fff;
margin-right:0;
margin-left:auto;
border:1px solid #e1e7ec;
border-radius:12px 12px 3px 12px;
color:#172b3f
}

.msg.admin{
background:#0879bd;
color:#fff;
margin-left:0;
margin-right:auto;
border-radius:12px 12px 12px 3px
}

.msg-time{
display:block;
font-size:7px;
margin-top:4px;
opacity:.65
}

.reply{
display:flex;
gap:8px;
padding:12px;
background:#fff;
border-top:1px solid #e1e7ec
}

.reply input{
flex:1;
min-width:0;
border:1px solid #dce5eb;
border-radius:8px;
padding:12px;
font-size:10px;
outline:none
}

.reply input:focus{
border-color:#0879bd
}

.reply button{
border:0;
background:#071b31;
color:#fff;
border-radius:8px;
padding:0 20px;
cursor:pointer;
font-size:10px;
min-width:70px
}

.reply button:disabled{
opacity:.5;
cursor:not-allowed
}

.chat-empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#8a99a7;
font-size:11px;
text-align:center
}

.loading{
text-align:center;
padding:20px;
color:#8a99a7;
font-size:10px
}

@media(max-width:800px){

.cards{
grid-template-columns:1fr 1fr
}

.form-grid{
grid-template-columns:1fr
}

.form-full{
grid-column:auto
}

.chat-list{
grid-template-columns:1fr;
height:auto
}

.chat-users{
max-height:250px
}

.chat-box{
height:600px
}

table{
display:block;
overflow-x:auto;
white-space:nowrap
}

}

@media(max-width:500px){

.container{
width:94%
}

.header{
padding:15px 3%
}

.cards{
grid-template-columns:1fr 1fr;
gap:10px
}

.stat-card{
padding:15px
}

.stat-card strong{
font-size:23px
}

.panel{
padding:15px
}

.chat-list{
gap:10px
}

.chat-box{
height:550px
}

.msg{
max-width:85%
}

}
</style>
</head>

<body>

<header class="header">

<div class="logo">
Dr <span>Borodat</span>
</div>

<div class="status" id="status">
در حال اتصال...
</div>

</header>


<main class="container">

<!-- ================= STATS ================= -->

<div class="cards">

<div class="stat-card">
<small>درخواست‌های خدمات</small>
<strong id="requestCount">0</strong>
</div>

<div class="stat-card">
<small>گفتگوها</small>
<strong id="chatCount">0</strong>
</div>

<div class="stat-card">
<small>محصولات</small>
<strong id="productCount">0</strong>
</div>

<div class="stat-card">
<small>سفارش‌ها</small>
<strong id="orderCount">0</strong>
</div>

</div>


<!-- ================= REQUESTS ================= -->

<section class="panel">

<div class="panel-title">

<h2>📥 درخواست‌های خدمات</h2>

<button class="refresh" onclick="loadDashboard()">
↻ بروزرسانی
</button>

</div>

<div id="requests"></div>

</section>


<!-- ================= PRODUCTS ADD ================= -->

<section class="panel">

<div class="panel-title">
<h2>🛒 مدیریت محصولات</h2>
</div>

<form id="productForm">

<div class="form-grid">

<input
id="productName"
placeholder="نام محصول"
required
>

<input
id="productPrice"
placeholder="قیمت"
required
>

<input
id="productStock"
placeholder="موجودی"
value="0"
>

<input
id="productCategory"
placeholder="دسته‌بندی"
required
>

<input
class="form-full"
id="productImage"
placeholder="آدرس تصویر محصول"
>

<textarea
class="form-full"
id="productDescription"
placeholder="توضیحات محصول"
></textarea>

<div class="form-full">

<button
class="add-btn"
type="submit"
>
➕ افزودن محصول
</button>

</div>

</div>

</form>

<div
id="productMessage"
class="message"
></div>

</section>


<!-- ================= PRODUCTS ================= -->

<section class="panel">

<div class="panel-title">
<h2>📦 محصولات</h2>
</div>

<div id="products"></div>

</section>


<!-- ================= ORDERS ================= -->

<section class="panel">

<div class="panel-title">
<h2>🛍️ سفارش‌ها</h2>
</div>

<div id="orders"></div>

</section>


<!-- ================= CHAT ================= -->

<section class="panel">

<div class="panel-title">

<h2>💬 پشتیبانی آنلاین</h2>

<button
class="refresh"
onclick="loadDashboard()"
>
↻ بروزرسانی
</button>

</div>


<div class="chat-list">

<!-- CHAT USERS -->

<div
class="chat-users"
id="chatUsers"
>

<div class="empty">
هنوز گفتگویی ثبت نشده است.
</div>

</div>


<!-- CHAT BOX -->

<div class="chat-box">

<div
class="chat-header"
id="chatHeader"
>

<div>

<strong>
گفتگو را انتخاب کنید
</strong>

<small>
برای مشاهده پیام‌ها یک مشتری را انتخاب کنید.
</small>

</div>

</div>


<div
class="messages"
id="messages"
>

<div class="chat-empty">
یک گفتگو را از سمت راست انتخاب کنید.
</div>

</div>


<div class="reply">

<input
id="replyInput"
type="text"
autocomplete="off"
placeholder="پاسخ خود را بنویسید..."
disabled
>

<button
id="replyButton"
onclick="sendReply()"
disabled
>
ارسال
</button>

</div>

</div>

</div>

</section>

</main>


<script>

/* =====================================================
API
===================================================== */

const API_BASE = "";


/* =====================================================
STATE
===================================================== */

let dashboardData = {
requests:[],
chats:[],
products:[],
orders:[]
};

let selectedChat = null;

let sendingReply = false;


/* =====================================================
API URL
===================================================== */

function api(path){
return API_BASE + path;
}


/* =====================================================
SAFE JSON RESPONSE
===================================================== */

async function readJsonResponse(response){

const text = await response.text();

if(!text || !text.trim()){

throw new Error(
"سرور پاسخ خالی برگرداند."
);

}

try{

return JSON.parse(text);

}catch(error){

console.error(
"INVALID JSON FROM SERVER:",
text
);

throw new Error(
"پاسخ سرور JSON معتبر نیست."
);

}

}


/* =====================================================
LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

const status =
document.getElementById("status");

status.textContent =
"در حال دریافت اطلاعات...";

try{

const response =
await fetch(
api("/api/admin/dashboard"),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

const data =
await readJsonResponse(response);

if(!response.ok){

throw new Error(
data.message ||
"خطا در دریافت اطلاعات."
);

}

if(data.success !== true){

throw new Error(
data.message ||
"پاسخ سرور معتبر نیست."
);

}

dashboardData = {

requests:Array.isArray(data.requests)
? data.requests
:[],

chats:Array.isArray(data.chats)
? data.chats
:[],

products:Array.isArray(data.products)
? data.products
:[],

orders:Array.isArray(data.orders)
? data.orders
:[]

};

renderAll();

status.textContent =
"● آنلاین";

status.style.color =
"#78e08f";

}catch(error){

console.error(
"ADMIN CONNECTION ERROR:",
error
);

status.textContent =
"● خطا در اتصال";

status.style.color =
"#ff8b8b";

}

}


/* =====================================================
RENDER ALL
===================================================== */

function renderAll(){

document.getElementById(
"requestCount"
).textContent =
dashboardData.requests.length;

document.getElementById(
"chatCount"
).textContent =
dashboardData.chats.length;

document.getElementById(
"productCount"
).textContent =
dashboardData.products.length;

document.getElementById(
"orderCount"
).textContent =
dashboardData.orders.length;

renderRequests();

renderProducts();

renderOrders();

renderChats();

if(selectedChat){

renderSelectedChat();

}

}


/* =====================================================
REQUESTS
===================================================== */

function renderRequests(){

const box =
document.getElementById("requests");

if(!dashboardData.requests.length){

box.innerHTML =
'<div class="empty">درخواستی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>
<th>نام</th>
<th>شماره</th>
<th>خدمت</th>
<th>توضیحات</th>
<th>زمان</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>

</thead>

<tbody>

${dashboardData.requests.map(item => `

<tr>

<td>
${escapeHtml(item.name)}
</td>

<td dir="ltr">
${escapeHtml(item.phone)}
</td>

<td>
${escapeHtml(item.service)}
</td>

<td>
${escapeHtml(item.description || "-")}
</td>

<td dir="ltr">
${escapeHtml(item.created_at)}
</td>

<td>
<span class="badge">
${escapeHtml(item.status || "new")}
</span>
</td>

<td>

<div class="actions">

<button
onclick="updateRequest('${item.id}','done')"
>
انجام شد
</button>

<button
onclick="updateRequest('${item.id}','processing')"
>
در حال انجام
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
PRODUCTS
===================================================== */

function renderProducts(){

const box =
document.getElementById("products");

if(!dashboardData.products.length){

box.innerHTML =
'<div class="empty">محصولی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>
<th>نام</th>
<th>دسته‌بندی</th>
<th>قیمت</th>
<th>موجودی</th>
<th>عملیات</th>
</tr>

</thead>

<tbody>

${dashboardData.products.map(product => `

<tr>

<td>
${escapeHtml(product.name)}
</td>

<td>
${escapeHtml(product.category)}
</td>

<td>
${escapeHtml(product.price)}
</td>

<td>
${escapeHtml(product.stock)}
</td>

<td>

<div class="actions">

<button
onclick="editProduct('${product.id}')"
>
ویرایش
</button>

<button
onclick="deleteProduct('${product.id}')"
>
حذف
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
ORDERS
===================================================== */

function renderOrders(){

const box =
document.getElementById("orders");

if(!dashboardData.orders.length){

box.innerHTML =
'<div class="empty">سفارشی ثبت نشده است.</div>';

return;

}

box.innerHTML = `

<table>

<thead>

<tr>
<th>نام</th>
<th>شماره</th>
<th>محصول</th>
<th>تعداد</th>
<th>زمان</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>

</thead>

<tbody>

${dashboardData.orders.map(order => `

<tr>

<td>
${escapeHtml(order.name)}
</td>

<td dir="ltr">
${escapeHtml(order.phone)}
</td>

<td>
${escapeHtml(order.product_name)}
</td>

<td>
${escapeHtml(order.quantity)}
</td>

<td dir="ltr">
${escapeHtml(order.created_at)}
</td>

<td>

<span class="badge">
${escapeHtml(order.status || "new")}
</span>

</td>

<td>

<div class="actions">

<button
onclick="updateOrder('${order.id}','processing')"
>
در حال انجام
</button>

<button
onclick="updateOrder('${order.id}','done')"
>
تکمیل شد
</button>

</div>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =====================================================
RENDER CHAT LIST
===================================================== */

function renderChats(){

const box =
document.getElementById("chatUsers");

if(!dashboardData.chats.length){

box.innerHTML =
'<div class="empty">هنوز گفتگویی ثبت نشده است.</div>';

return;

}

box.innerHTML =
dashboardData.chats.map(chat => {

const messages =
Array.isArray(chat.messages)
? chat.messages
:[];

const lastMessage =
messages.length
? messages[messages.length - 1].message
: "هنوز پیامی ثبت نشده";

return `

<div
class="chat-user ${
selectedChat === chat.id
? "active"
: ""
}"
onclick="selectChat('${chat.id}')"
>

<strong>
${escapeHtml(chat.name)}
</strong>

<small dir="ltr">
${escapeHtml(chat.phone)}
</small>

<div class="last-message">
${escapeHtml(lastMessage)}
</div>

<div class="chat-time">
${escapeHtml(chat.updated_at || chat.created_at || "")}
</div>

</div>

`;

}).join("");

}


/* =====================================================
SELECT CHAT
===================================================== */

function selectChat(id){

selectedChat = id;

renderChats();

renderSelectedChat();

}


/* =====================================================
RENDER SELECTED CHAT
===================================================== */

function renderSelectedChat(){

const chat =
dashboardData.chats.find(
item => item.id === selectedChat
);

const messagesBox =
document.getElementById("messages");

const header =
document.getElementById("chatHeader");

const input =
document.getElementById("replyInput");

const button =
document.getElementById("replyButton");


if(!chat){

header.innerHTML = `

<div>

<strong>
گفتگو را انتخاب کنید
</strong>

<small>
برای مشاهده پیام‌ها یک مشتری را انتخاب کنید.
</small>

</div>

`;

messagesBox.innerHTML = `

<div class="chat-empty">
یک گفتگو را از سمت راست انتخاب کنید.
</div>

`;

input.disabled = true;
button.disabled = true;

return;

}


/* HEADER */

header.innerHTML = `

<div>

<strong>
${escapeHtml(chat.name)}
</strong>

<small dir="ltr">
${escapeHtml(chat.phone)}
</small>

</div>

`;


input.disabled = false;
button.disabled = false;


/* MESSAGES */

const messages =
Array.isArray(chat.messages)
? chat.messages
:[];


if(!messages.length){

messagesBox.innerHTML = `

<div class="chat-empty">
هنوز پیامی در این گفتگو وجود ندارد.
</div>

`;

return;

}


messagesBox.innerHTML =
messages.map(message => `

<div class="msg ${
message.sender === "admin"
? "admin"
: "customer"
}">

${escapeHtml(message.message)}

<span class="msg-time">
${escapeHtml(message.created_at || "")}
</span>

</div>

`).join("");


/* ALWAYS SCROLL TO BOTTOM */

setTimeout(() => {

messagesBox.scrollTop =
messagesBox.scrollHeight;

},50);

}


/* =====================================================
SEND REPLY
===================================================== */

async function sendReply(){

if(sendingReply)return;

if(!selectedChat){

alert(
"ابتدا یک گفتگو را انتخاب کنید."
);

return;

}

const input =
document.getElementById("replyInput");

const button =
document.getElementById("replyButton");

const message =
input.value.trim();

if(!message)return;


sendingReply = true;

button.disabled = true;

button.textContent =
"در حال ارسال...";


try{

const response =
await fetch(
api("/api/admin/chat/reply"),
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
chat_id:selectedChat,
message:message
})
}
);


const data =
await readJsonResponse(response);


if(!response.ok){

throw new Error(
data.message ||
"ارسال پاسخ ناموفق بود."
);

}


if(data.success !== true){

throw new Error(
data.message ||
"ارسال پاسخ ناموفق بود."
);

}


/*
IMPORTANT:
اول متن را پاک می‌کنیم،
بعد اطلاعات را دوباره می‌گیریم.
*/

input.value = "";


/*
رفرش کامل داشبورد،
اما selectedChat حفظ می‌شود.
*/

await loadDashboard();


/*
اگر گفتگو هنوز وجود داشت،
دوباره همان گفتگو را باز می‌کنیم.
*/

/* =====================================================
ADD PRODUCT
===================================================== */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();

const messageBox =
document.getElementById(
"productMessage"
);

const payload = {

name:
document.getElementById(
"productName"
).value.trim(),

price:
document.getElementById(
"productPrice"
).value.trim(),

stock:
document.getElementById(
"productStock"
).value.trim(),

category:
document.getElementById(
"productCategory"
).value.trim(),

image:
document.getElementById(
"productImage"
).value.trim(),

description:
document.getElementById(
"productDescription"
).value.trim()

};


try{

const response =
await fetch(
api("/api/admin/products"),
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify(payload)
}
);

const data =
await readJsonResponse(response);

if(!response.ok){

throw new Error(
data.message ||
"ثبت محصول ناموفق بود."
);

}

if(data.success !== true){

throw new Error(
data.message ||
"ثبت محصول ناموفق بود."
);

}

messageBox.className =
"message success";

messageBox.textContent =
"محصول با موفقیت اضافه شد.";

this.reset();

await loadDashboard();

}catch(error){

console.error(error);

messageBox.className =
"message error";

messageBox.textContent =
error.message;

}

});

/* =====================================================
EDIT PRODUCT
===================================================== */

async function editProduct(id){

const product =
dashboardData.products.find(
item => item.id === id
);

if(!product)return;


const name =
prompt(
"نام محصول:",
product.name
);

if(name === null)return;


const price =
prompt(
"قیمت:",
product.price
);

if(price === null)return;


const stock =
prompt(
"موجودی:",
product.stock
);

if(stock === null)return;


const category =
prompt(
"دسته‌بندی:",
product.category
);

if(category === null)return;


try{

const response =
await fetch(
api("/api/admin/products/"+encodeURIComponent(id)),
{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
name:name,
price:price,
stock:stock,
category:category
})
}
);

const data =
await readJsonResponse(response);

if(!response.ok){

throw new Error(
data.message ||
"ویرایش ناموفق بود."
);

}

if(data.success !== true){

throw new Error(
data.message ||
"ویرایش ناموفق بود."
);

}

await loadDashboard();

}catch(error){

alert(
error.message
);

}

}

/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
