<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>diag</title>
<style>body{font:15px/1.8 sans-serif;padding:14px;direction:ltr;text-align:left}pre{white-space:pre-wrap;word-break:break-all;background:#eee;padding:8px;border-radius:6px}</style>
</head><body>
<h3>Site diagnostics</h3>
<pre id="out">running...</pre>
<script>
const API = 'https://borodat-panel.onrender.com';
const out = document.getElementById('out');
const lines = [];
const log = t => { lines.push(t); out.textContent = lines.join('\n'); };
log('page: ' + location.href);
log('origin: ' + location.origin);
log('online: ' + navigator.onLine);
log('serviceWorker controller: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'YES' : 'no'));
(async () => {
  for (const path of ['/api/products', '/api/slides', '/api/categories']) {
    const t0 = Date.now();
    try {
      const r = await fetch(API + path, { cache: 'no-store' });
      const text = await r.text();
      let ok = false; try { ok = JSON.parse(text).success === true; } catch (e) {}
      log('OK  ' + path + ' status=' + r.status + ' json_success=' + ok + ' ms=' + (Date.now()-t0));
    } catch (e) {
      let net = 'unknown';
      try { await fetch(API + path, { mode: 'no-cors', cache: 'no-store' }); net = 'reachable (so CORS is blocking)'; } catch (e2) { net = 'NOT reachable (network/DNS/filter)'; }
      log('FAIL ' + path + ' error=' + e.name + ': ' + e.message + ' ms=' + (Date.now()-t0) + ' | ' + net);
    }
  }
  try {
    const t0 = Date.now();
    await fetch('https://ghizwjxqhqhwucfonkca.supabase.co/storage/v1/object/public/products/products/f8d4271e-7b31-4840-a5fa-600bedc6ad55_1000115951.jpg', { mode: 'no-cors', cache: 'no-store' });
    log('OK  supabase image reachable ms=' + (Date.now()-t0));
  } catch (e) { log('FAIL supabase image: ' + e.name + ': ' + e.message); }
  log('--- done, take a screenshot of this page ---');
})();
</script></body></html>
