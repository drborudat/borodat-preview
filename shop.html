*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{

.hero{

.products{

.heading{

}

.heading small{

font-size:27px;

.heading p{
font-size:10px;

.product:hover{

.product-image{

align-items:center;
justify-content:center;
font-size:65px
}

.product-info{

}

.product-info small{

}
